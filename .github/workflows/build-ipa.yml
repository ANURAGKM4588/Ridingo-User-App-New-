name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Ridingo iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Initialize Capacitor iOS Project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Configure iOS Fullscreen & Status Bar in Info.plist
        run: |
          plutil -replace UIUserInterfaceStyle -string "Light" ios/App/App/Info.plist
          plutil -replace UIViewControllerBasedStatusBarAppearance -bool false ios/App/App/Info.plist
          plutil -replace UIStatusBarStyle -string "UIStatusBarStyleDarkContent" ios/App/App/Info.plist

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install
          cd ../..

      - name: Build Xcode Archive
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r -q Ridingo-User-App.ipa Payload
          cd ..
          echo "IPA Created Successfully: build/Ridingo-User-App.ipa"
          ls -la build/Ridingo-User-App.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ridingo-User-App-IPA
          path: build/Ridingo-User-App.ipa
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: Ridingo iOS App Release (v1.0.1)
          make_latest: true
          body: |
            ## Ridingo iOS App (.ipa) — Release v1.0.1
            
            This release contains the latest iOS build package (.ipa) for **Ridingo**:
            - **Modern Account & Profile Settings**: Saved Places, Safety & Handover, Payments & GST Invoices, and Help Desk.
            - **Minimal Profile Editing**: Edit pencil modal for updating name and phone.
            - **Tactile Tap & Click Motion**: Pure mobile tactile press feedback without desktop hover outlines.
            - **Frameless native display**: Edge-to-edge layout ready for sideloading with AltStore, Sideloadly, TrollStore, or Xcode.
          files: build/Ridingo-User-App.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
